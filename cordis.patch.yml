# dsh-claude-ux 自带注册条目（bundle layer）。
# `dsh plugin --profile web add github:eri64/dsh-claude-ux` 安装后会自动把本包
# 加入 profile 的 dsh.profile.bundles，此文件随包加载，无需手动改任何配置。
# 需要覆盖默认值时改设置页即可；仅 patch 级选项（blacklist/cnTimezones 等）
# 可改本文件后重新安装，或参考 examples/cordis.patch.yml。
- insert:
    - id: claude
      name: dsh-claude-ux
      config:
        enabled: false
        region:
          target: cn
          policy: block
          minSignals: 2
          refusalEndsAfter: 3
          ipCheck: false
          webRtcCheck: false
          blockOnUnknown: false
        abuse:
          enabled: true
          warnThreshold: 1
          endThreshold: 3
          warnEveryOffense: true
          severeEndsImmediately: true
          llm:
            enabled: true
            mode: all
        steganography: true
