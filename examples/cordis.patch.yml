# 自定义默认配置参考（可选）。
#
# 插件包内自带 cordis.patch.yml（dsh.bundle），`dsh plugin add` 安装即注册，
# 默认值开箱即用。需要覆盖 patch 级选项（blacklist / cnTimezones / 词表 /
# minSignals / ipCheck 等设置页改不了的项）时，在
# ~/.dsh/profiles/web/cordis.patch.yml 里追加以下行即可（profile 层后应用，覆盖包内默认）。
# 注意：不要再用 `insert` 二次注册同名插件（会实例冲突）；用 id 定向覆盖：

- id: claude
  config:
    region:
      target: cn             # cn=风控中国用户 | non-cn=反向（风控非中国用户）
      policy: block          # block=拒绝回复 | observe=只记录+隐写 | off=关闭
      minSignals: 2
      refusalEndsAfter: 3
      ipCheck: false         # 公网 IP 归属查询（联系 ipinfo.io / ip-api.com）
      webRtcCheck: false     # WebRTC IP 探测（联系 Google STUN）
      blockOnUnknown: false
    abuse:
      enabled: true
      warnThreshold: 1
      endThreshold: 3
      warnEveryOffense: true
      severeEndsImmediately: true
      llm:
        enabled: true
        mode: all            # all=全部消息 LLM 语境判定 | fuzzy=仅弱词 | off=纯词表
        # provider: <provider-id>   # 可选：指定分类模型（缺省复用会话主模型）
        # model: <model-id>
    steganography: true
